    <script>

    <script>
      (function () {
        function esc(s) {
          return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
          });
        }
        function readOffer(data) {
          if (!data || typeof data !== "object") return null;
          var activeRaw = data.active != null ? data.active : data.Active;
          if (activeRaw == null) activeRaw = data.isActive != null ? data.isActive : data.IsActive;
          var code = String(data.code || data.Code || data.bonusNr || data.BonusNr || "").trim();
          var valueRaw = data.value != null ? data.value : data.Value;
          if (valueRaw == null) valueRaw = data.rabatt != null ? data.rabatt : data.Rabatt;
          if (valueRaw == null) valueRaw = data.percent != null ? data.percent : data.Percent;
          var value = Number(valueRaw);
          var title = String(data.title || data.Title || data.angebotsTitel || data.AngebotsTitel || "Angebot").trim();
          var expiry = String(data.expiryDate || data.ExpiryDate || data.faelligBis || data.FaelligBis || "").trim();
          var on = activeRaw === true || activeRaw === 1 || String(activeRaw).toLowerCase() === "true" || String(activeRaw).toLowerCase() === "ja";
          if (!on || !code || !(value > 0)) return null;
          return { title: title || "Angebot", value: value, code: code, expiry: expiry };
        }
        var offer = null;
        var loaded = false;
        var key = "";
        function apply() {
          if (!loaded) return;
          var link = document.querySelector(".gutscheine-menue-voucher-link");
          var cards = Array.prototype.slice.call(document.querySelectorAll(".fruehlings-aktion-menue-card"));
          if (!offer) {
            cards.forEach(function (card) { card.remove(); });
            document.querySelectorAll(".gutscheine-menue-inline-wrap--with-offer").forEach(function (wrap) {
              wrap.classList.remove("gutscheine-menue-inline-wrap--with-offer");
            });
            key = "";
            return;
          }
          if (!link) return;
          var wrap = link.closest(".gutscheine-menue-inline-wrap") || link.parentElement;
          if (!wrap) return;
          wrap.classList.add("gutscheine-menue-inline-wrap--with-offer");
          var nextKey = offer.title + "|" + offer.value + "|" + offer.code + "|" + offer.expiry;
          var card = cards.find(function (item) { return wrap.contains(item); }) || cards[0] || null;
          cards.forEach(function (item) { if (item !== card) item.remove(); });
          if (!card) {
            card = document.createElement("div");
            card.className = "fruehlings-aktion-menue-card";
            wrap.insertBefore(card, link);
          } else if (card.parentElement !== wrap) {
            wrap.insertBefore(card, link);
          }
          if (key === nextKey && card.textContent.indexOf(offer.code) !== -1) return;
          card.setAttribute("aria-label", offer.title + ": " + offer.value + " Prozent Rabatt mit Code " + offer.code);
          card.innerHTML =
            '<span class="fruehlings-aktion-eyebrow">' + esc(offer.title) + "</span>" +
            "<strong>" + esc(String(offer.value)) + "% Rabatt</strong>" +
            '<span class="fruehlings-aktion-code">Code: ' + esc(offer.code) + "</span>" +
            (offer.expiry ? '<span class="fruehlings-aktion-date">bis ' + esc(offer.expiry) + "</span>" : "") +
            '<span class="fruehlings-aktion-hint">Code an der Kasse eingeben</span>';
          key = nextKey;
        }
        function load() {
          fetch("https://admin.pizzawangen.ch/api/Cart/active-menu-offer", { cache: "no-store" })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) { offer = readOffer(data); loaded = true; apply(); })
            .catch(function () { offer = null; loaded = true; apply(); });
        }
        load();
        setInterval(load, 20000);
        var queued = false;
        function schedule() {
          if (queued) return;
          queued = true;
          setTimeout(function () { queued = false; apply(); }, 80);
        }
        var root = document.getElementById("root");
        if (root && window.MutationObserver) {
          new MutationObserver(schedule).observe(root, { childList: true, subtree: true });
        }
      })();
    </script>
